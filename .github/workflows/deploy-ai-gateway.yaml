name: Deploy reviewed AI Gateway plan

on:
  pull_request:
    branches: [main]
    paths:
      - ai-gateway.yaml
      - certs/data-plane.crt
      - ci/plan.json
      - .github/workflows/deploy-ai-gateway.yaml
  workflow_dispatch:
    inputs:
      plan_sha256:
        description: SHA-256 of the committed ci/plan.json you reviewed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-gateway-summit-ai-demo
  cancel-in-progress: false

env:
  KONGCTL_VERSION: "1.19.0"
  KONGCTL_NO_TELEMETRY: "true"
  KONNECT_REGION: ${{ vars.KONNECT_REGION }}
  KONNECT_ORG_ID: bc68a981-db50-43b4-a6bc-6a3ab0557d3c
  KONNECT_NAMESPACE: summit-ai-demo

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1
        with:
          kongctl-version: ${{ env.KONGCTL_VERSION }}
      - name: Preview configuration changes
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_PAT }}
        run: |
          set -euo pipefail
          test "$KONNECT_REGION" = us
          actual_org="$(kongctl get organization --profile default --region "$KONNECT_REGION" \
            -o json --jq '.id' --jq-raw-output)"
          test "$actual_org" = "$KONNECT_ORG_ID"
          kongctl diff --mode apply -f ai-gateway.yaml --profile default \
            --region "$KONNECT_REGION" --require-namespace "$KONNECT_NAMESPACE" \
            -o text | tee preview.txt
          {
            printf '### Live configuration preview\n\n```text\n'
            cat preview.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the reviewed plan
        env:
          EXPECTED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$KONNECT_REGION" = us
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$EXPECTED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  ci/plan.json\n' "$EXPECTED_PLAN_SHA256" | sha256sum --check -
          jq -e --arg ns "$KONNECT_NAMESPACE" --arg cli "kongctl/$KONGCTL_VERSION" '
            .metadata.mode == "apply" and .metadata.generator == $cli and
            all(.changes[]; .namespace == $ns and
              (.action == "CREATE" or .action == "UPDATE") and
              all(.secret_writes[]?; all(.expression.parts[];
                (.literal != null and .source == null) or
                (.literal == null and (.source.kind == "file" or
                  (.source.kind == "env" and
                    .source.reference == "OPENAI_API_KEY"))))))
          ' ci/plan.json >/dev/null
      - uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1
        with:
          kongctl-version: ${{ env.KONGCTL_VERSION }}
      - name: Apply the approved plan
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$KONGCTL_DEFAULT_KONNECT_PAT"
          test "$(kongctl version --full | cut -d ' ' -f 1)" = "$KONGCTL_VERSION"
          actual_org="$(kongctl get organization --profile default \
            --region "$KONNECT_REGION" -o json --jq '.id' --jq-raw-output)"
          test "$actual_org" = "$KONNECT_ORG_ID"
          mkdir -p evidence
          {
            printf 'Source: %s\nActor: %s\n' "$GITHUB_SHA" "$GITHUB_ACTOR"
            printf 'Organization: %s\nNamespace: %s\n' "$actual_org" "$KONNECT_NAMESPACE"
            sha256sum ci/plan.json
            kongctl diff --plan ci/plan.json --profile default --region "$KONNECT_REGION"
          } > evidence/review.txt
          cat evidence/review.txt
          cat evidence/review.txt >> "$GITHUB_STEP_SUMMARY"
          kongctl apply --plan ci/plan.json --profile default \
            --region "$KONNECT_REGION" --auto-approve -o json \
            --execution-report-file evidence/apply.json
          jq -e '.summary.status == "success"' evidence/apply.json
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
