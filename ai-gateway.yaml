_defaults:
  kongctl:
    namespace: summit-ai

ai_gateways:
  - ref: summit-ai
    name: summit-ai
    display_name: Summit AI
    description: Local OpenAI-backed AI Gateway
    deployment_type: hybrid
    proxy_urls:
      - host: localhost
        port: 8000
        protocol: http
    data_plane_certificates:
      - ref: summit-ai-data-plane
        title: summit-ai-data-plane
        description: Local Docker data plane
        cert: !file ./certs/data-plane.crt
    model_providers:
      - ref: openai
        name: openai
        display_name: OpenAI
        type: openai
        config:
          auth:
            type: basic
            headers:
              - name: Authorization
                value: !secret
                  parts:
                    - "Bearer "
                    - !env OPENAI_API_KEY
    models:
      - ref: demo-chat
        name: demo-chat
        display_name: Demo Chat
        type: model
        enabled: true
        formats:
          - type: openai
        config:
          route:
            paths:
              - /v1
            model:
              body_param: model
              values:
                - demo-chat
        targets:
          - name: gpt-4.1-mini
            provider: openai
            allow_auth_override: false
            config:
              type: openai
        policies: []
        capabilities:
          - generate
      - ref: demo-nano
        name: demo-nano
        display_name: Demo Nano
        type: model
        enabled: true
        formats:
          - type: openai
        config:
          route:
            paths:
              - /v1
            model:
              body_param: model
              values:
                - demo-nano
        targets:
          - name: gpt-4.1-nano
            provider: openai
            allow_auth_override: false
            config:
              type: openai
        policies: []
        capabilities:
          - generate
